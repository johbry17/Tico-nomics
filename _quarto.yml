project:
  type: website
  output-dir: docs
  render:
    - reports/index.qmd
    - reports/eda-analysis.qmd
    - reports/data-dictionary.qmd
    - reports/methodology.qmd

author: "Bryan C. Johns"

website:
  title: "Tico-nomics"
  description: "The World Bank Group in Costa Rica: Development Finance, Shifting Priorities, and 45 Years of an Evolving Relationship"
  favicon: images/landmark-solid.ico
  navbar:
    left:
      - href: reports/index.qmd
        text: Overview
      - href: reports/eda-analysis.qmd
        text: Analysis
      - href: reports/data-dictionary.qmd
        text: Data
      - href: reports/methodology.qmd
        text: Methods
    right:
      - icon: github
        href: https://github.com/johbry17/Tico-nomics
  page-footer:
    left: "Data sources: World Bank"
    center: "© {{< current-year >}} Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    shortcodes:
      - year.lua
    theme:
      light: reports/custom-light.scss
      dark:  reports/custom-dark.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show code"
    fig-width: 10
    fig-height: 6.5
    fig-dpi: 150
    embed-resources: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
