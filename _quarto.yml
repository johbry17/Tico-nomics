project:
  type: website
  output-dir: docs
  render:
    - reports/overview.qmd
    - reports/analysis.qmd
    - reports/data-dictionary.qmd
    - reports/methodology.qmd
  resources:
    - reports/scripts/site.js
  post-render: python scripts/fix_titles.py

website:
  title: "Tico-nomics"
  description: "The World Bank Group in Costa Rica: Development Finance, Shifting Priorities, and 45 Years of an Evolving Relationship"
  site-url: "https://johbry17.github.io/Tico-nomics/"
  favicon: images/landmark-solid.ico
  open-graph: true
  twitter-card: true
  back-to-top-navigation: true
  navbar:
    left:
      - href: reports/overview.qmd
        text: Overview
      - href: reports/analysis.qmd
        text: Analysis
      - href: reports/data-dictionary.qmd
        text: Data
      - href: reports/methodology.qmd
        text: Methods
    right:
      - icon: github
        href: https://github.com/johbry17/Tico-nomics
  page-footer:
    left: "Data sources: World Bank"
    center: "© <span id='copyright-year'>2026</span> Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    author-meta: "Bryan C. Johns"
    theme:
      light: reports/custom-light.scss
      dark:  reports/custom-dark.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show code"
    fig-width: 10
    fig-height: 6.5
    fig-dpi: 150
    embed-resources: false
    smooth-scroll: true
    include-after-body: # site.js for copyright year & back-to-top smooth scroll
      - text: |
          <script src="scripts/site.js"></script>

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
